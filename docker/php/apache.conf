ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Folder internal project tidak boleh diakses dari browser
<DirectoryMatch "^/var/www/html/(docker|backup|\.git|\.env)(/|$)">
    Require all denied
</DirectoryMatch>

# File sensitif / bukan aset publik
<FilesMatch "(^\.|\.env|\.sql|\.ini|\.md|\.ya?ml|\.lock)$">
    Require all denied
</FilesMatch>
